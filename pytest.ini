[pytest]
# Without `testpaths`, a bare `pytest` from the repo root also tries to
# collect the vendored framework's own suite and fails collection outright
# with `ModuleNotFoundError: No module named 'tests.conftest'` -- so
# AGENTS.md's documented `uv run pytest -q` did not work as written and
# everyone had to know to type `pytest tests` (ARC-HANDOFF-005).
testpaths = tests

# Unregistered marks only warn, so a typo'd `-m` name silently selects
# nothing and reports success. Registering them makes a typo an error.
markers =
    cerebras_live: hits the real Cerebras API; requires CEREBRAS_API_KEY
    slow_local_engine: drives the real local game engine; slow
